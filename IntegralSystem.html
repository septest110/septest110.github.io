<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>积分制生活规划 · 手账本</title>
<style>
  :root {
    --background: hsl(40 30% 96%);
    --foreground: hsl(25 15% 25%);
    --card: hsl(0 0% 100%);
    --primary: hsl(120 25% 55%);
    --primary-foreground: hsl(0 0% 100%);
    --primary-light: hsl(120 30% 93%);
    --primary/10: hsl(120 25% 55% / 0.1);
    --primary/20: hsl(120 25% 55% / 0.2);
    --primary/40: hsl(120 25% 55% / 0.4);
    --primary/60: hsl(120 25% 55% / 0.6);
    --primary/80: hsl(120 25% 55% / 0.8);
    --secondary: hsl(20 60% 85%);
    --secondary-foreground: hsl(20 40% 30%);
    --secondary-light: hsl(20 60% 92%);
    --muted: hsl(40 20% 92%);
    --muted-foreground: hsl(25 8% 50%);
    --border: hsl(30 15% 88%);
    --destructive: hsl(0 70% 60%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, hsl(120 25% 55% / 0.05), hsl(40 30% 96%), hsl(20 60% 85% / 0.1));
    color: var(--foreground);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    min-height: 100vh;
  }
  .container { max-width: 768px; margin: 0 auto; padding: 0 1rem; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 0.375rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 500;

    white-space: nowrap; font-family: inherit;
  }
  .btn:focus-visible { box-shadow: 0 0 0 2px var(--primary); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover:not(:disabled) { filter: brightness(0.95); }
  .btn-primary:active:not(:disabled) { transform: scale(0.98); }
  .btn-outline { background: white; border: 1px solid var(--border); color: var(--foreground); }
  .btn-outline:hover:not(:disabled) { background: var(--muted); }
  .btn-ghost { background: transparent; color: var(--foreground); }
  .btn-ghost:hover:not(:disabled) { background: var(--muted); }
  .btn-icon { width: 2.25rem; height: 2.25rem; padding: 0; }
  .btn-sm { height: 2rem; font-size: 0.75rem; padding: 0 0.75rem; }
  .card {
    background: white; border: 1px solid hsl(30 15% 88% / 0.6);
    border-radius: 0.75rem; box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.04);
  }
  .card-header { padding: 1rem 1.25rem 0.75rem; }
  .card-title { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
  .card-body { padding: 1.25rem; }
  .tabular { font-variant-numeric: tabular-nums; }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateX(-50%) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-40px) scale(1.2); }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .animate-fade-in-up { animation: fadeInUp 0.5s ease-out both; }

  .hero-subtitle { font-size: 0.875rem; color: var(--muted-foreground); margin-top: 0.5rem; }
  .points-total-card {
    background: linear-gradient(135deg, var(--primary/10), white, hsl(20 60% 85% / 0.1));

  .points-unit { margin-top: 0.5rem; font-size: 0.875rem; color: var(--muted-foreground); }

  .date-nav {

  .task-card:active:not(:disabled) { transform: scale(0.98); }
  .task-card:disabled { cursor: not-allowed; }
  .task-card.completed { background: var(--primary-light); border-color: hsl(120 25% 75%); }
  .task-card.past { 
  opacity: 1; 
  background: hsl(30 25% 92%); 
  border-color: hsl(30 20% 85%);
}
.task-card.past .task-name { color: hsl(30 15% 45%); }
.task-card.past .task-desc { color: hsl(30 10% 55%); }
.task-card.past .task-points { color: hsl(30 30% 50%); }
  .task-icon { font-size: 1.5rem; }
  .task-name-row {

  }

    border: 1px solid var(--secondary);

    box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.04);
    cursor: pointer; font-family: inherit; text-align: center;
    transition: all 0.15s ease;
  }
  .reward-card:hover:not(:disabled) {
    transform: translateY(-2px); box-shadow: 0 4px 8px 0 rgb(0 0 0 / 0.06);
  }
  .reward-card:active:not(:disabled) { transform: scale(0.98); }
  .reward-card:disabled {
    cursor: not-allowed; opacity: 0.6;
    background: var(--muted); border-color: var(--border);
  }
  .reward-icon { font-size: 1.75rem; }
  .reward-name { font-weight: 600; color: var(--foreground); }
  .reward-desc {
    font-size: 0.6875rem; color: var(--muted-foreground);

  }
  .reward-points { font-size: 0.875rem; font-weight: 700; color: var(--secondary-foreground); }

  }

  }
  .progress-ring-label {
    text-align: center; font-size: 0.75rem; color: var(--muted-foreground); margin-top: 0.5rem;
  }
  .rings-container { display: flex; justify-content: space-around; }
  .ring-item { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
  .css-bar-chart {

    height: 180px; padding: 0 0.5rem; gap: 0.25rem;
    border-bottom: 1px solid var(--border); margin-bottom: 0.5rem;

  }

  }

  }
  .css-chart-legend {
    display: flex; justify-content: center; gap: 1rem; font-size: 12px;

  }
  .css-legend-item { display: flex; align-items: center; gap: 0.375rem; }
  .css-legend-dot { width: 10px; height: 10px; border-radius: 2px; }
  .calendar-grid-header {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.25rem; margin-bottom: 0.5rem;
  }
  .calendar-grid-header div {
    text-align: center; font-size: 11px; color: var(--muted-foreground);
    font-weight: 500; padding: 0.25rem 0;
  }

    display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.25rem;
  }

    border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer;

  }
  .calendar-day:hover:not(:disabled) { filter: brightness(0.95); }

  .calendar-day.other-month { background: transparent !important; color: hsl(25 8% 50% / 0.3); }
  .calendar-day.selected { outline: 2px solid var(--primary); outline-offset: 1px; }
  .calendar-legend {
    display: flex; align-items: center; justify-content: center;

  }
  .calendar-legend .colors { display: flex; gap: 2px; }

  }

  }
  .history-item:last-child { border-bottom: none; }

  .history-icon {

  }

<body>
<div id="root"></div>

<script>
// ============ 数据配置 ============
const TASKS = [
  { id: '1', name: '早起', points: 20, description: '8:00前起床算早起', icon: '🌅' },
  { id: '2', name: '早睡', points: 20, description: '23:30前入睡', icon: '🌙' },
  { id: '3', name: '完成工作', points: 50, description: '9:30-18:30居家办公', icon: '💻' },
  { id: '4', name: '背单词', points: 5, description: '每天20个新词/清理每日复习', icon: '📚', repeatable: true },
  { id: '5a', name: '早起洗漱', points: 5, description: '早上洗漱', icon: '🪥', timeSlot: 'morning' },
  { id: '5b', name: '睡前洗漱', points: 5, description: '晚上洗漱', icon: '🪥', timeSlot: 'evening' },
  { id: '6a', name: '护肤(早)', points: 5, description: '早上护理', icon: '🧴', timeSlot: 'morning' },
  { id: '6b', name: '护肤(晚)', points: 5, description: '晚上护理', icon: '🧴', timeSlot: 'evening' },
  { id: '7', name: '喝秋梨膏', points: 5, description: '一杯', icon: '🍐' },
  { id: '8', name: '拉橡皮筋', points: 5, description: '每拉一次加分，可多次', icon: '🏃', repeatable: true },
  { id: '9', name: '赚取微软积分', points: 10, description: '完成微软积分任务', icon: '🎯' },
  { id: '10a', name: '吃药抹药(早)', points: 5, description: '早上吃药抹药', icon: '💊', timeSlot: 'morning' },
  { id: '10b', name: '吃药抹药(晚)', points: 5, description: '晚上吃药抹药', icon: '💊', timeSlot: 'evening' },
];
const REWARDS = [
  { id: '1', name: '刷视频一小时', points: 10, description: '短视频/视频平台一小时', unit: '小时', icon: '🎬' },
  { id: '2', name: '追剧', points: 20, description: '每集20积分', unit: '集', icon: '📺' },
  { id: '3a', name: '看小说15分钟', points: 15, description: '十五分钟阅读', unit: '次', icon: '📖' },
  { id: '3b', name: '看小说半小时', points: 30, description: '半小时阅读', unit: '次', icon: '📖' },
  { id: '3', name: '看小说', points: 60, description: '每小时60积分', unit: '小时', icon: '📖' },
  { id: '4', name: '打游戏', points: 30, description: '每小时30积分', unit: '小时', icon: '🎮' },
  { id: '5', name: '奶茶', points: 400, description: '25元起送，高积分门槛控制频率', unit: '杯', icon: '🧋' },
  { id: '6', name: '出门吃饭', points: 500, description: '约50元，用积分替代花钱冲动', unit: '次', icon: '🍜' },
  { id: '7', name: '清理游戏日常', points: 10, description: '完成游戏日常任务清理', unit: '次',icon: '🧹' },
  { id: '8', name: '小额解馋零食', points: 100, description: '5-8元，小额解馋', unit: '次', icon: '🍪' },
  { id: '9', name: '常规零食', points: 200, description: '10-18元，常规零食', unit: '次', icon: '🍫' },
  { id: '10', name: '豪华零食大餐', points: 400, description: '20-30元，豪华零食', unit: '次', icon: '🍱' },
];
const WEEKDAY_NAMES = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

// ============ 状态管理 ============
const STORAGE_KEYS = {
  TOTAL: 'lifepoints_total',
  HISTORY: 'lifepoints_history',
  DAILY_TASKS: 'lifepoints_dailyTasks',
  ONBOARDED: 'lifepoints_onboarded',
  SPECIAL_TASKS: 'lifepoints_specialTasks',
};
function getStorageNumber(key, fallback) {
  try { const v = localStorage.getItem(key); if (v === null) return fallback; const n = Number(v); return Number.isFinite(n) ? n : fallback; } catch (e) { return fallback; }
}
function getStorageJSON(key, fallback) {
  try { const v = localStorage.getItem(key); if (!v) return fallback; return JSON.parse(v); } catch (e) { return fallback; }
}

const Store = {
  state: null,
  listeners: new Set(),
init() {
    this.state = {
      totalPoints: getStorageNumber(STORAGE_KEYS.TOTAL, 0),
      history: getStorageJSON(STORAGE_KEYS.HISTORY, []),
      dailyTasks: getStorageJSON(STORAGE_KEYS.DAILY_TASKS, {}),
      onboarded: localStorage.getItem(STORAGE_KEYS.ONBOARDED) === '1',
      currentDate: formatDate(new Date()),
      allEarnedToday: false, // 新增：今日是否已发放全勤奖励
      specialTasks: getStorageJSON(STORAGE_KEYS.SPECIAL_TASKS, {}),
    };
    
    // 数据迁移：确保所有旧任务都有完整属性
    this._migrateSpecialTasks();
    
    // 初始化时检查今日是否已完成全勤奖励
    this._checkAllEarnedToday();
  },
  // 数据迁移方法
  _migrateSpecialTasks() {
    let changed = false;
    for (const date in this.state.specialTasks) {
      const tasks = this.state.specialTasks[date];
      if (!Array.isArray(tasks)) {
        // 如果不是数组，转换为数组
        this.state.specialTasks[date] = [];
        changed = true;
        continue;
      }
      this.state.specialTasks[date] = tasks.filter(task => {
        // 过滤掉已完成的旧任务
        if (task && task.completed) return false;
        // 确保任务有 id 属性
        if (!task.id) {
          task.id = 'special-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
          changed = true;
        }
        // 确保任务有 completed 属性
        if (task.completed === undefined) {
          task.completed = false;
          changed = true;
        }
        // 确保任务有 icon 属性
        if (!task.icon) {
          task.icon = '⚡';
          changed = true;
        }
        return true;
      });
      if (tasks.length !== this.state.specialTasks[date].length) {
        changed = true;
      }
    }
    if (changed) {
      this._persist();
    }
  },
  // 新增方法：检查今日全勤奖励状态
  _checkAllEarnedToday() {
    const today = formatDate(new Date());
    const todayRecords = this.state.history.filter(r => r.date === today);
    const bonusRecord = todayRecords.find(r => r.itemId === 'all-earned-bonus');
    this.state.allEarnedToday = !!bonusRecord;
  },
  subscribe(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  notify() { this.listeners.forEach(fn => fn(this.state)); },
  finishOnboarding() {
    this.state.onboarded = true;
    try { localStorage.setItem(STORAGE_KEYS.ONBOARDED, '1'); } catch(e) {}
    this.notify();
  },
  setCurrentDate(date) { this.state.currentDate = date; this.notify(); },
  goPrevDay() {
    const d = new Date(this.state.currentDate);
    d.setDate(d.getDate() - 1);
    this.state.currentDate = formatDate(d);
    this.notify();
  },
  goNextDay() {
    const d = new Date(this.state.currentDate);
    d.setDate(d.getDate() + 1);
    const maxDate = new Date();
    maxDate.setDate(maxDate.getDate() + 1); // 最多只能到明天
    const next = formatDate(d);
    if (d > maxDate) return;
    this.state.currentDate = next;
    this.notify();
},
  goToday() { this.state.currentDate = formatDate(new Date()); this.notify(); },
  // ... existing code ...
  checkinTask(task) {
    const today = formatDate(new Date());
    if (this.state.currentDate !== today) return { success: false, message: '只能打卡当天的任务哦～' };
    
    if (!task.repeatable) {
      const completed = this.state.dailyTasks[today] ?? [];
      if (completed.includes(task.id)) return { success: false, message: '今天已经完成过这个任务啦' };
      this.state.dailyTasks = { ...this.state.dailyTasks, [today]: [...completed, task.id] };
    }
    
    this.state.totalPoints += task.points;
    const record = {
      id: Date.now() + '-' + task.id + '-' + Math.random().toString(36).slice(2, 7),
      date: today, timestamp: Date.now(),
      itemName: task.name, type: 'earn', points: task.points, itemId: task.id,
    };
    this.state.history = [record, ...this.state.history];
    
    // 检查全勤奖励
    const fixedTasks = TASKS.filter(t => !t.repeatable);
    const completedToday = this.state.dailyTasks[today] ?? [];
    const allCompleted = fixedTasks.every(t => completedToday.includes(t.id));
    
    if (allCompleted && !this.state.allEarnedToday) {
      const bonusPoints = 50;
      this.state.totalPoints += bonusPoints;
      const bonusRecord = {
        id: Date.now() + '-all-earned-' + Math.random().toString(36).slice(2, 7),
        date: today, timestamp: Date.now(),
        itemName: '每日全勤奖励', type: 'earn', points: bonusPoints, itemId: 'all-earned-bonus',
      };
      this.state.history = [bonusRecord, ...this.state.history];
      this.state.allEarnedToday = true;
      this._persist();
      this.notify();
      return { success: true, message: '🎉 +' + task.points + ' 积分！全勤奖励 +' + bonusPoints + ' 积分！' };
    }
    
    this._persist();
    this.notify();
    return { success: true, message: '+' + task.points + ' 积分！' };
  },

  addManualRecord(name, points, type) {
    const today = formatDate(new Date());
    if (this.state.currentDate !== today) return { success: false, message: '只能记录当天的积分哦～' };
    if (!name || !name.trim()) return { success: false, message: '请输入记录名称' };
    if (!points || points <= 0) return { success: false, message: '请输入有效积分数' };
    
    const actualPoints = type === 'earn' ? points : -points;
    this.state.totalPoints += actualPoints;
    const record = {
      id: Date.now() + '-manual-' + Math.random().toString(36).slice(2, 7),
      date: today, timestamp: Date.now(),
      itemName: name.trim(), type: type, points: actualPoints,
      itemId: 'manual',
    };
    this.state.history = [record, ...this.state.history];
    this._persist();
    this.notify();
    return { success: true, message: (type === 'earn' ? '+' : '-') + points + ' 积分记录已添加' };
  },
 // ... existing code ...
 redeemReward(reward) {
    const today = formatDate(new Date());
    if (this.state.totalPoints < reward.points) {
      return { success: false, message: '积分不足，还差 ' + (reward.points - this.state.totalPoints) + ' 分～' };
    }
    
    //    // 100积分以下的奖励只能用当天赚取的积分兑换
    //    if (reward.points < 100) {
    //   const netEarned = this.todayNetEarned();
    //   if (netEarned < reward.points) {
    //     return { success: false, message: '小额奖励需用当天赚取的积分兑换，今日净赚 ' + netEarned + ' 分，还差 ' + (reward.points - netEarned) + ' 分～' };
    //   }
    // }
    
    this.state.totalPoints -= reward.points;
    const record = {
      id: Date.now() + '-' + reward.id, date: today, timestamp: Date.now(),
      itemName: reward.name, type: 'spend', points: reward.points, itemId: reward.id,
    };
    this.state.history = [record, ...this.state.history];
    this._persist();
    this.notify();
    return { success: true, message: '-' + reward.points + ' 积分，尽情享受吧！' };
  },
// ... existing code ...
resetToday() {
  const today = formatDate(new Date());
  
  // 计算今日赚取的总积分（包括手动添加的）
  const todayEarned = this.state.history
    .filter(r => r.date === today && r.type === 'earn')
    .reduce((sum, r) => sum + r.points, 0);
  
  // 计算今日花费的总积分
  const todaySpent = this.state.history
    .filter(r => r.date === today && r.type === 'spend')
    .reduce((sum, r) => sum + r.points, 0);
  
  // 如果没有任何记录，返回0
  if (todayEarned === 0 && todaySpent === 0) return 0;
  
  // 删除今日所有记录
  this.state.history = this.state.history.filter(r => !(r.date === today));
  
  // 恢复积分：减去赚取的，加回花费的
  this.state.totalPoints = this.state.totalPoints - todayEarned + todaySpent;
  
  // 清空今日任务
  const newDaily = { ...this.state.dailyTasks };
  delete newDaily[today];
  this.state.dailyTasks = newDaily;
  
  this._persist();
  this.notify();
  return todayEarned + todaySpent;
},
  exportRecords() {
    if (this.state.history.length === 0 && this.state.totalPoints === 0) return { success: false, message: '还没有积分数据哦～' };
    const exportData = {
      version: '1.0',
      exportTime: new Date().toISOString(),
      totalPoints: this.state.totalPoints,
      history: this.state.history,
      dailyTasks: this.state.dailyTasks,
      specialTasks: this.state.specialTasks
    };
    const text = JSON.stringify(exportData, null, 2);
    const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '积分数据_' + formatDate(new Date()) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return { success: true, message: '已导出积分数据，请将文件传输到手机～' };
  },
  importRecords() {
    return new Promise((resolve) => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,.txt,application/json,text/plain';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) {
          resolve({ success: false, message: '未选择文件' });
          return;
        }
        try {
          const text = await file.text();
          const isTxt = file.name.toLowerCase().endsWith('.txt') || file.type === 'text/plain';
          let data;
          if (isTxt) {
            // 解析txt文件 - 支持多种格式
            const history = [];
            const lines = text.split(/\r?\n/).filter(line => line.trim());
            
            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith('//')) continue;
              
              let record = null;
              
              // 格式1(推荐): 日期 [时间] 描述 ±积分
              // 例如: 2026-08-21 22:27 刷视频一小时 -10
              // 例如: 2026-08-21 完成英语阅读 +20
              // 例如: 2026-08-21 跑步3公里 15
              const simpleMatch = trimmed.match(/^(\d{4}-\d{1,2}-\d{1,2})(?:\s+\d{1,2}:\d{2})?\s+(.+?)\s+([+-]\d+)\s*$/);
              if (simpleMatch) {
                const [, dateStr, itemName, pointsStr] = simpleMatch;
                const points = parseInt(pointsStr);
                const absPoints = Math.abs(points);
                const type = points < 0 ? 'spend' : 'earn';
                
                if (itemName && absPoints > 0) {
                  const dateParts = dateStr.split('-');
                  const normalizedDate = `${dateParts[0]}-${String(parseInt(dateParts[1])).padStart(2,'0')}-${String(parseInt(dateParts[2])).padStart(2,'0')}`;
                  const timestamp = new Date(normalizedDate + 'T12:00:00').getTime();
                  
                  record = {
                    id: `${timestamp}-txt-${Math.random().toString(36).slice(2, 7)}`,
                    date: normalizedDate,
                    timestamp: timestamp,
                    itemName: itemName.trim(),
                    type: type,
                    points: type === 'spend' ? -absPoints : absPoints,
                    itemId: 'txt-import'
                  };
                }
              }
              
              // 格式2: 用分隔符(竖线/逗号/制表符)的标准格式
              // 日期 | 描述 | 类型 | 积分
              if (!record) {
                let parts;
                if (trimmed.includes('|')) {
                  parts = trimmed.split('|').map(s => s.trim());
                } else if (trimmed.includes(',')) {
                  parts = trimmed.split(',').map(s => s.trim());
                } else if (trimmed.includes('\t')) {
                  parts = trimmed.split('\t').map(s => s.trim());
                }
                
                if (parts && parts.length >= 4) {
                  const [dateStr, itemName, typeStr, pointsStr] = parts;
                  let points = parseInt(pointsStr) || 0;
                  
                  // 检查积分是否带符号
                  if (pointsStr.startsWith('-')) {
                    points = -Math.abs(points);
                  }
                  
                  // 确定类型
                  let type;
                  if (points < 0) {
                    type = 'spend';
                    points = Math.abs(points);
                  } else if (typeStr && (typeStr.includes('支') || typeStr.toLowerCase() === 'spend')) {
                    type = 'spend';
                  } else {
                    type = 'earn';
                  }
                  
                  if (dateStr && itemName && points > 0 && /^\d{4}-/.test(dateStr)) {
                    const dateMatch = dateStr.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
                    if (dateMatch) {
                      const normalizedDate = `${dateMatch[1]}-${String(parseInt(dateMatch[2])).padStart(2,'0')}-${String(parseInt(dateMatch[3])).padStart(2,'0')}`;
                      const timestamp = new Date(normalizedDate + 'T12:00:00').getTime();
                      
                      record = {
                        id: `${timestamp}-txt-${Math.random().toString(36).slice(2, 7)}`,
                        date: normalizedDate,
                        timestamp: timestamp,
                        itemName: itemName.trim(),
                        type: type,
                        points: type === 'spend' ? -points : points,
                        itemId: 'txt-import'
                      };
                    }
                  }
                }
              }
              
              if (record) {
                history.push(record);
              }
            }
            
            if (history.length === 0) {
              resolve({ 
                success: false, 
                message: 'txt文件格式错误，未能解析任何记录。\n\n支持格式示例:\n2026-08-21 刷视频一小时 -10\n2026-08-21 22:27 完成任务 +20\n2026-08-21 | 描述 | earn | 20'
              });
              return;
            }
            
            const totalPoints = history.reduce((sum, r) => sum + r.points, 0);
            data = {
              totalPoints: totalPoints,
              history: history,
              dailyTasks: {},
              specialTasks: {}
            };
          } else {
            // JSON格式导入
            data = JSON.parse(text);
            if (!data || typeof data !== 'object') {
              resolve({ success: false, message: '文件格式错误' });
              return;
            }
            if (typeof data.totalPoints !== 'number' || !Array.isArray(data.history)) {
              resolve({ success: false, message: '数据结构不完整' });
              return;
            }
          }
          
          const totalPoints = data.totalPoints || 0;
          const history = Array.isArray(data.history) ? data.history : [];
          const dailyTasks = data.dailyTasks || {};
          const specialTasks = data.specialTasks || {};
          const recordCount = history.length;
          
          if (!confirm(`将导入 ${recordCount} 条记录，总积分 ${totalPoints}。\n\n是否覆盖当前数据？（确定覆盖，取消添加）`)) {
            resolve({ success: false, message: '已取消导入' });
            return;
          }
          const appendMode = !confirm('\n\n确定=覆盖当前数据\n取消=添加到当前数据');
          if (appendMode) {
            this.state.totalPoints = totalPoints;
            this.state.history = history;
            this.state.dailyTasks = dailyTasks;
            this.state.specialTasks = specialTasks;
          } else {
            this.state.totalPoints += totalPoints;
            const existingIds = new Set(this.state.history.map(r => r.id));
            const newHistory = history.filter(r => !existingIds.has(r.id));
            this.state.history = [...this.state.history, ...newHistory];
            for (const date in dailyTasks) {
              if (!this.state.dailyTasks[date]) this.state.dailyTasks[date] = [];
              this.state.dailyTasks[date] = [...new Set([...this.state.dailyTasks[date], ...dailyTasks[date]])];
            }
            for (const date in specialTasks) {
              if (!this.state.specialTasks[date]) this.state.specialTasks[date] = [];
              this.state.specialTasks[date] = [...this.state.specialTasks[date], ...specialTasks[date]];
            }
          }
          this._persist();
          this.notify();
          resolve({ success: true, message: `导入成功！共 ${recordCount} 条记录，总积分 ${this.state.totalPoints}` });
        } catch (err) {
          resolve({ success: false, message: '导入失败：' + err.message });
        }
      };

  _persist() {

      localStorage.setItem(STORAGE_KEYS.DAILY_TASKS, JSON.stringify(this.state.dailyTasks));
      localStorage.setItem(STORAGE_KEYS.SPECIAL_TASKS, JSON.stringify(this.state.specialTasks));

  },
  isToday() { return this.state.currentDate === formatDate(new Date()); },
  completedToday() { return this.state.dailyTasks[this.state.currentDate] ?? []; },
  todayStats() {
    const today = formatDate(new Date());

    const earned = todayRecords.filter(r => r.type === 'earn').reduce((s, r) => s + r.points, 0);

  todayNetEarned() {

    const earned = todayRecords.filter(r => r.type === 'earn').reduce((s, r) => s + r.points, 0);
    const spent = todayRecords.filter(r => r.type === 'spend').reduce((s, r) => s + r.points, 0);

  const task = tasks.find(t => t.id === taskId);

  if (task.completed) return { success: false, message: '任务已完成' };
  
  // 记录积分
  this.state.totalPoints += task.points;
  const record = {
    id: Date.now() + '-' + task.id,
    date: date,
    timestamp: Date.now(),
    itemName: '[突发] ' + task.name,
    type: 'earn',
    points: task.points,
    itemId: task.id,
  };
  this.state.history = [record, ...this.state.history];
  
  // 完成后从数组中移除任务
  this.state.specialTasks[date] = tasks.filter(t => t.id !== taskId);

  currentDateRecords() {
    return this.state.history
      .filter(r => r.date === this.state.currentDate)
      .sort((a, b) => b.timestamp - a.timestamp);
  },
  weeklyRate() {
    const totalTasks = TASKS.filter(t => !t.repeatable).length;
    const now = new Date();
    const dayOfWeek = (now.getDay() + 6) % 7;
    const days = dayOfWeek + 1;
    let count = 0;
    for (let i = 0; i < days; i++) {
      const d = new Date(now);
      d.setDate(now.getDate() - i);
      const key = formatDate(d);
      const completed = (this.state.dailyTasks[key] ?? []).filter(id => {
        const task = TASKS.find(t => t.id === id);
        return task && !task.repeatable;
      }).length;
      count += completed;
    }
    const total = totalTasks * days;
    return total === 0 ? 0 : Math.round((count / total) * 100);
  },
  monthlyRate() {
    const totalTasks = TASKS.filter(t => !t.repeatable).length;
    const now = new Date();
    const days = now.getDate();
    let count = 0;
    for (let i = 0; i < days; i++) {
      const d = new Date(now.getFullYear(), now.getMonth(), i + 1);
      const key = formatDate(d);
      const completed = (this.state.dailyTasks[key] ?? []).filter(id => {
        const task = TASKS.find(t => t.id === id);
        return task && !task.repeatable;
      }).length;
      count += completed;
    }
    const total = totalTasks * days;
    return total === 0 ? 0 : Math.round((count / total) * 100);
  },
  last7Days() {
    const result = [];
    const now = new Date();
    for (let i = 6; i >= 0; i--) {
      const d = new Date(now);
      d.setDate(now.getDate() - i);
      const key = formatDate(d);
      const dayRecords = this.state.history.filter(r => r.date === key);
      const earn = dayRecords.filter(r => r.type === 'earn').reduce((s, r) => s + r.points, 0);
      const spend = dayRecords.filter(r => r.type === 'spend').reduce((s, r) => s + r.points, 0);
      result.push({ date: key, label: (d.getMonth() + 1) + '/' + d.getDate(), earn, spend, net: earn - spend });
    }
    return result;
  },
  calendarData() {
    const d = new Date(this.state.currentDate);
    const year = d.getFullYear();
    const month = d.getMonth();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const totalTasks = TASKS.filter(t => !t.repeatable).length;
    const days = [];
    const firstDay = new Date(year, month, 1).getDay();
    const prevMonthDays = firstDay === 0 ? 6 : firstDay - 1;
    const prevMonthDate = new Date(year, month, 0);
    for (let i = prevMonthDays - 1; i >= 0; i--) {
      const dayNum = prevMonthDate.getDate() - i;
      const dateKey = formatDate(new Date(year, month - 1, dayNum));
      const completed = (this.state.dailyTasks[dateKey] ?? []).filter(id => {
        const task = TASKS.find(t => t.id === id);
        return task && !task.repeatable;
      }).length;
      days.push({ date: dateKey, day: dayNum, rate: totalTasks > 0 ? completed / totalTasks : 0, isCurrentMonth: false, isPast: dateKey <= formatDate(new Date()) });
    }
    for (let i = 1; i <= daysInMonth; i++) {
      const dateKey = formatDate(new Date(year, month, i));
      const completed = (this.state.dailyTasks[dateKey] ?? []).filter(id => {
        const task = TASKS.find(t => t.id === id);
        return task && !task.repeatable;
      }).length;
      days.push({ date: dateKey, day: i, rate: totalTasks > 0 ? completed / totalTasks : 0, isCurrentMonth: true, isPast: dateKey <= formatDate(new Date()) });
    }
    while (days.length % 7 !== 0) {
      const lastDate = days[days.length - 1].date;
      const [y, m, dd] = lastDate.split('-').map(Number);
      const next = new Date(y, m - 1, dd + 1);
      days.push({ date: formatDate(next), day: next.getDate(), rate: 0, isCurrentMonth: false, isPast: formatDate(next) < formatDate(new Date()) });
    }
    return days;
  },
};

// ============ Toast ============
const Toast = {
  container: null,
  init() {
    this.container = document.createElement('div');
    this.container.className = 'toast-container';
    document.body.appendChild(this.container);
  },
  show(message, type) {
    if (!this.container) this.init();
    const el = document.createElement('div');
    el.className = 'toast-item ' + (type || 'info');
    el.textContent = message;
    this.container.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(-10px)';
      el.style.transition = 'all 0.25s ease';
      setTimeout(() => el.remove(), 250);
    }, 2500);
  },
  success(msg) { this.show(msg, 'success'); },
  error(msg) { this.show(msg, 'error'); },
  info(msg) { this.show(msg, 'info'); },
};

// ============ 进度环 SVG ============
function progressRingHTML(value, label, color) {
  const radius = 36;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference - (value / 100) * circumference;
  return '<div class="ring-item">' +
    '<div class="progress-ring-wrap">' +
      '<svg viewBox="0 0 100 100">' +
        '<circle cx="50" cy="50" r="' + radius + '" fill="none" stroke="hsl(40 20% 92%)" stroke-width="8"></circle>' +
        '<circle cx="50" cy="50" r="' + radius + '" fill="none" stroke="' + color + '" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + circumference + '" stroke-dashoffset="' + offset + '" style="transition: stroke-dashoffset 0.6s ease;"></circle>' +
      '</svg>' +
      '<div class="progress-ring-value" style="color: ' + color + ';">' + value + '%</div>' +
    '</div>' +
    '<div class="progress-ring-label">' + label + '</div>' +
  '</div>';
}

// ============ CSS 柱状图 ============
function cssBarChartHTML(data) {
  const maxVal = Math.max.apply(null, data.map(d => Math.max(d.earn, d.spend)).concat([1]));
  let barsHTML = '';
  data.forEach(d => {
    const earnH = Math.max(2, (d.earn / maxVal) * 100);
    const spendH = Math.max(2, (d.spend / maxVal) * 100);
    barsHTML += '<div class="css-bar-group">' +
      '<div class="css-bar earn" style="height: ' + earnH + '%;" title="赚取: ' + d.earn + '"></div>' +
      '<div class="css-bar spend" style="height: ' + spendH + '%;" title="花费: ' + d.spend + '"></div>' +
      '<div class="css-bar-label">' + d.label + '</div>' +
    '</div>';
  });
  return '<div class="css-chart-legend">' +
    '<div class="css-legend-item"><span class="css-legend-dot" style="background:#7CB689"></span>赚取</div>' +
    '<div class="css-legend-item"><span class="css-legend-dot" style="background:#E8B88B"></span>花费</div>' +
  '</div><div class="css-bar-chart">' + barsHTML + '</div>';
}

function formatTime(ts) {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function getCalendarDayStyle(day, isSelected) {
  if (!day.isCurrentMonth) return 'other-month';
  let bg = 'var(--muted)';
  let color = 'var(--foreground)';
  
  // 过去日期使用淡紫色/蓝紫色调
  if (day.isPast && day.rate === 0) {
    bg = 'hsl(270 25% 92%)';
    color = 'hsl(270 15% 45%)';
  } else if (day.isPast && day.rate > 0) {
    // 过去但有打卡记录的日期，使用更深的紫色
    if (day.rate < 0.3) { bg = 'hsl(270 30% 85%)'; }
    else if (day.rate < 0.6) { bg = 'hsl(270 35% 78%)'; }
    else if (day.rate < 0.9) { bg = 'hsl(270 40% 70%)'; color = 'hsl(270 15% 25%)'; }
    else { bg = 'hsl(270 45% 65%)'; color = 'white'; }
  } else if (day.rate > 0) {
    // 未来日期使用绿色
    if (day.rate < 0.3) { bg = 'var(--primary/20)'; }
    else if (day.rate < 0.6) { bg = 'var(--primary/40)'; }
    else if (day.rate < 0.9) { bg = 'var(--primary/60)'; color = 'white'; }
    else { bg = 'var(--primary/80)'; color = 'white'; }
  }
  return 'background: ' + bg + '; color: ' + color + ';' + (isSelected ? ' outline: 2px solid var(--primary); outline-offset: 1px;' : '');
}

// ============ 事件绑定 ============
function attachEventListeners() {
  var prevBtn = document.getElementById('prev-day');
  if (prevBtn) prevBtn.addEventListener('click', function() { Store.goPrevDay(); });

  var nextBtn = document.getElementById('next-day');
  if (nextBtn) nextBtn.addEventListener('click', function() { Store.goNextDay(); });

  var goTodayBtn = document.getElementById('go-today');
  if (goTodayBtn) goTodayBtn.addEventListener('click', function() { Store.goToday(); });

  var resetBtn = document.getElementById('reset-today');
  if (resetBtn) resetBtn.addEventListener('click', function() { showResetDialog(); });

  var taskGrid = document.getElementById('task-grid');
  if (taskGrid) {
    taskGrid.querySelectorAll('.task-card').forEach(function(card) {
      card.addEventListener('click', function(e) {
        if (e.target.closest('.manage-btn')) return;
        var taskId = card.dataset.taskId;
        var task = TASKS.find(function(t) { return t.id === taskId; });
        if (!task) return;
        var isToday = Store.isToday();
        var completedToday = Store.completedToday();
        if (completedToday.includes(taskId) && !task.repeatable) return;
        if (!isToday) return;
        var result = Store.checkinTask(task);
        if (result.success) {
          var rect = card.getBoundingClientRect();
          var gridRect = taskGrid.getBoundingClientRect();
          var x = rect.left - gridRect.left + rect.width / 2;
          var y = rect.top - gridRect.top;
          var floatEl = document.createElement('div');
          floatEl.className = 'float-text';
          floatEl.style.left = x + 'px';
          floatEl.style.top = y + 'px';
          floatEl.textContent = '+' + task.points;
          taskGrid.appendChild(floatEl);
          setTimeout(function() { floatEl.remove(); }, 900);
          Toast.success(result.message);
        } else {
          Toast.error(result.message);
        }
      });
    });
  }

  // 突发任务卡片点击
document.querySelectorAll('.special-task-card').forEach(function(card) {
    card.addEventListener('click', function(e) {
      if (e.target.closest('.manage-btn')) return;
      if (card.classList.contains('completed')) {
        Toast.success('任务已完成');
        return;
      }
      var taskId = card.dataset.specialId;
      var taskDate = card.dataset.specialDate;
      var result = Store.completeSpecialTask(taskDate, taskId);
      if (result.success) {
        Toast.success(result.message);
        render();
      } else {
        Toast.error(result.message);
      }
    });
  });

  // 布置突发任务按钮
  var addSpecialBtn = document.getElementById('add-special-task');
  if (addSpecialBtn) {
    addSpecialBtn.addEventListener('click', function() {
      showAddSpecialTaskDialog();
    });
  }

  var rewardGrid = document.getElementById('reward-grid');
  if (rewardGrid) {
    rewardGrid.querySelectorAll('.reward-card').forEach(function(card) {
      card.addEventListener('click', function(e) {
        if (e.target.closest('.manage-btn')) return;
        var rewardId = card.dataset.rewardId;
        var reward = REWARDS.find(function(r) { return r.id === rewardId; });
        if (!reward) return;
        //if (!Store.isToday()) { Toast.error('只能兑换当天的奖励哦～'); return; }
        var result = Store.redeemReward(reward);
        if (result.success) Toast.success(result.message);
        else Toast.error(result.message);
      });
    });
  }

  var calendarGrid = document.getElementById('calendar-grid');
  if (calendarGrid) {
    calendarGrid.querySelectorAll('.calendar-day').forEach(function(btn) {
      btn.addEventListener('click', function() {
        if (btn.disabled) return;
        Store.setCurrentDate(btn.dataset.date);
      });
    });
  }
  var exportBtn = document.getElementById('export-btn');
  if (exportBtn) exportBtn.addEventListener('click', function() {
    var result = Store.exportRecords();
    if (result.success) Toast.success(result.message);
    else Toast.error(result.message);
  });

  var importBtn = document.getElementById('import-btn');
  if (importBtn) importBtn.addEventListener('click', function() {
    Store.importRecords().then(function(result) {
      if (result.success) {
        Toast.success(result.message);
        render();
      } else {
        Toast.error(result.message);
      }
    });
  });
    var moreBtn = document.getElementById('history-more-btn');
  if (moreBtn) moreBtn.addEventListener('click', function() {
    window.__showAllHistory = !window.__showAllHistory;
    render();
  });

  var manualBtn = document.getElementById('manual-add-btn');
  if (manualBtn) manualBtn.addEventListener('click', function() { showManualAddDialog(); });

  document.addEventListener('click', function(e) {
    var editBtn = e.target.closest('[data-edit-task]');
    if (editBtn) { e.stopPropagation(); e.preventDefault(); showEditTaskDialog(editBtn.dataset.editTask); return; }
    var deleteBtn = e.target.closest('[data-delete-task]');
    if (deleteBtn) { e.stopPropagation(); e.preventDefault(); showDeleteTaskConfirm(deleteBtn.dataset.deleteTask); return; }
    var editSpecial = e.target.closest('[data-edit-special]');
    if (editSpecial) { e.stopPropagation(); e.preventDefault(); showEditSpecialDialog(editSpecial.dataset.editSpecial, editSpecial.dataset.specialDate); return; }
    var deleteSpecial = e.target.closest('[data-delete-special]');
    if (deleteSpecial) { e.stopPropagation(); e.preventDefault(); showDeleteSpecialConfirm(deleteSpecial.dataset.deleteSpecial, deleteSpecial.dataset.specialDate); return; }
    var editReward = e.target.closest('[data-edit-reward]');
    if (editReward) { e.stopPropagation(); e.preventDefault(); showEditRewardDialog(editReward.dataset.editReward); return; }
    var deleteReward = e.target.closest('[data-delete-reward]');
    if (deleteReward) { e.stopPropagation(); e.preventDefault(); showDeleteRewardConfirm(deleteReward.dataset.deleteReward); return; }
  });

  var addTaskBtn = document.getElementById('add-task-btn');
  if (addTaskBtn) addTaskBtn.addEventListener('click', function(e) { e.stopPropagation(); showAddTaskDialog(); });

  var addRewardBtn = document.getElementById('add-reward-btn');
  if (addRewardBtn) addRewardBtn.addEventListener('click', function(e) { e.stopPropagation(); showAddRewardDialog(); });
}

  overlay.innerHTML = '<div class="dialog-content" onclick="event.stopPropagation()">' +
    '<div class="dialog-header">' +
      '<div class="dialog-icon">✨</div>' +
      '<div class="dialog-title">欢迎来到积分手账本</div>' +
      '<div class="dialog-desc">用游戏化的方式，让自律变得像玩一样简单～</div>' +
    '</div>' +
    '<div class="rule-list">' +
      '<div class="rule-item"><div class="rule-icon">✅</div><div><div class="rule-title">打卡赚积分</div><div class="rule-desc">完成日常任务打卡，每完成一个获得对应积分</div></div></div>' +
      '<div class="rule-item"><div class="rule-icon">🎁</div><div><div class="rule-title">兑换花积分</div><div class="rule-desc">用攒下的积分兑换追剧、奶茶等娱乐奖励</div></div></div>' +
      '<div class="rule-item"><div class="rule-icon">🔄</div><div><div class="rule-title">每日重置</div><div class="rule-desc">每天 0 点自动重置打卡状态，积分累计保留</div></div></div>' +
    '</div>' +
    '<div style="margin-top: 1.25rem;">' +
      '<button class="btn btn-primary" id="onboarding-start" style="width: 100%; height: 2.75rem; font-size: 1rem;">开始使用</button>' +
    '</div>' +
  '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function() { Store.finishOnboarding(); overlay.remove(); });
  overlay.querySelector('#onboarding-start').addEventListener('click', function() { Store.finishOnboarding(); overlay.remove(); });
}

function renderDialogs() {
  if (!Store.state.onboarded) setTimeout(showOnboarding, 300);
}

// ============ 启动 ============
Store.init();
Store.subscribe(render);
render();
</script>
</body>
